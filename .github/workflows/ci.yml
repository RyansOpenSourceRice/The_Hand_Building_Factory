name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify citation metadata is in sync
        run: >-
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8')).version;const m=fs.readFileSync('CITATION.cff','utf8').match(/^version:\s*\"([^\"]+)\"/m);if(!m){console.error('CITATION.cff has no version field');process.exit(1);}if(m[1]!==p){console.error(`CITATION.cff version ${m[1]} != package.json version ${p}`);process.exit(1);}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps firefox chromium
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy-pages:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
