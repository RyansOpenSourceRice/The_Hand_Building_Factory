<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HANDS ON!</title>
    <meta
      name="description"
      content="Assemble a robotic hand on stage while the crowd cheers. A Meta Quest 3 WebXR game."
    />
    <style>
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/atkinson-hyperlegible-latin-400.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/atkinson-hyperlegible-latin-ext-400.woff2")
          format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("fonts/atkinson-hyperlegible-latin-700.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("fonts/atkinson-hyperlegible-latin-ext-700.woff2")
          format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0a0e1a;
        color: #f2f4ff;
        text-align: center;
        padding: 24px;
        font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
      }
      #boot-fallback h1 {
        margin: 0;
        font-size: 32px;
      }
      #boot-fallback p {
        margin: 0;
        max-width: 42ch;
        color: #c9d4ff;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="boot-fallback">
      <h1>HANDS ON!</h1>
      <p id="boot-message">Loading the stage...</p>
      <noscript>
        <p>
          This game needs JavaScript and WebGL.
          Turn on JavaScript, then reload the page.
        </p>
      </noscript>
    </div>
    <canvas id="stage" aria-label="HANDS ON! game view"></canvas>
    <div id="live-status" class="visually-hidden" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
